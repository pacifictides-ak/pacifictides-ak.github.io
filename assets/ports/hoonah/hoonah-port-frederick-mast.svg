<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylized Hoonah: forested Chichagof Island hills above Port Frederick, the red Hoonah Packing Company cannery on pilings at Icy Strait Point, Front Street houses and the harbor breakwater, seiners at the floats, and a humpback whale blowing out in Icy Strait">
