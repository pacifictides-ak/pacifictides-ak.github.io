<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Yakutat Bay: Mount St. Elias rising over the Malaspina ice, the blue face of Hubbard Glacier up-bay, forested islands off Monti Bay, a troller with its poles out, and Gulf of Alaska swell breaking on the beach">
  <defs>
    <linearGradient id="ysky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e2ea"/><stop offset="1" stop-color="#f1efe8"/></linearGradient>
    <linearGradient id="ysea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f8798"/><stop offset="1" stop-color="#2b4f60"/></linearGradient>
    <linearGradient id="yice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f4f8"/><stop offset="1" stop-color="#9cc7d8"/></linearGradient>
  </defs>
  <rect width="1200" height="180" fill="url(#ysky)"/>
  <!-- Mount St. Elias pyramid and the St. Elias range -->
  <path d="M120 112 L250 70 L330 18 L410 66 L520 52 L600 84 L700 60 L800 96 L800 112 Z" fill="#8b9aa6"/>
  <path d="M300 38 L330 18 L360 40 L344 46 L330 36 L316 46 Z M500 60 L520 52 L540 62 L520 66 Z M684 66 L700 60 L716 70 L700 72 Z" fill="#fbfcfb"/>
  <!-- Malaspina piedmont ice lobe -->
  <path d="M120 112 Q260 96 420 104 Q560 110 640 112 Z" fill="#eef3f4"/>
  <!-- Hubbard Glacier face up-bay -->
  <path d="M860 112 L880 92 L1010 88 L1040 112 Z" fill="url(#yice)"/>
  <path d="M884 96 L884 112 M910 92 L910 112 M940 90 L940 112 M972 90 L972 112 M1004 90 L1004 112" stroke="#7fb0c4" stroke-width="2"/>
  <path d="M800 112 L860 80 L900 84 L860 112 Z M1040 112 L1080 76 L1140 90 L1200 82 L1200 112 Z" fill="#7a8a94"/>
  <!-- water -->
  <rect y="112" width="1200" height="68" fill="url(#ysea)"/>
  <!-- forested islands off Monti Bay -->
  <path d="M40 122 Q90 110 150 120 Q120 126 40 124 Z M180 126 Q230 116 290 125 Q240 130 180 128 Z M640 120 Q700 110 770 121 Q720 126 640 123 Z" fill="#2f4a3c"/>
  <!-- small ice bergs drifting out of Disenchantment Bay -->
  <path d="M960 124 l10 -6 l12 6 Z M1010 130 l6 -4 l8 4 Z M930 132 l7 -4 l7 4 Z" fill="#e6f2f6"/>
  <!-- troller with poles out -->
  <g transform="translate(470 120)">
    <path d="M0 14 L84 14 L76 24 L8 24 Z" fill="#f4f1ea" stroke="#33434c" stroke-width="1.5"/>
    <rect x="44" y="2" width="22" height="12" fill="#c4473a" stroke="#33434c" stroke-width="1.2"/>
    <path d="M54 2 L54 -20 M54 -20 L4 -2 M54 -20 L112 -4" stroke="#33434c" stroke-width="1.5" fill="none"/>
    <path d="M4 -2 L4 28 M112 -4 L112 28" stroke="#33434c" stroke-width="0.8" stroke-dasharray="2 3"/>
  </g>
  <!-- surf breaking on the outer beach (the "far north shore") -->
  <path d="M0 166 Q60 146 120 162 Q160 152 210 166 L210 180 L0 180 Z" fill="#e8eef0" opacity="0.9"/>
  <path d="M10 160 Q50 140 90 156" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M1100 170 Q1150 156 1200 166 L1200 180 L1100 180 Z" fill="#d9c9a6"/>
</svg>
