<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <title>Boat ramp tide gauge: a trailer ramp with high-water and low-water lines; at low tide the ramp runs dry (original Pacific Tides artwork)</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M6 20 L110 66" stroke="#6e5a3c" stroke-width="5"/>
    <path d="M40 35 L118 35" stroke="#3f7a8f" stroke-width="2.5" stroke-dasharray="6 4"/>
    <path d="M92 58 L118 58" stroke="#3f7a8f" stroke-width="2.5"/>
    <path d="M12 12 L12 6 M12 6 L30 6" stroke="#6e5a3c" stroke-width="2"/>
    <text x="100" y="31" font-family="Georgia, serif" font-size="9" fill="#3f7a8f" stroke="none">HW</text>
    <text x="100" y="76" font-family="Georgia, serif" font-size="9" fill="#3f7a8f" stroke="none">LW</text>
  </g>
</svg>
