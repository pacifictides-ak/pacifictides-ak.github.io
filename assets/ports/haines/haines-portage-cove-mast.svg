<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylized Portage Cove at Haines: Mount Ripinski and the Chilkat Range behind town, the white officers' row of Fort William H. Seward on the hill, boats behind the harbor breakwater, and bald eagles over Lynn Canal">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6e2ea"/><stop offset="1" stop-color="#f1f5f6"/></linearGradient>
    <linearGradient id="hsea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f8797"/><stop offset="1" stop-color="#365c6c"/></linearGradient>
  </defs>
  <rect width="1200" height="180" fill="url(#hsky)"/>
  <!-- Chilkat Range (far, left) -->
  <path d="M0 110 L70 58 L110 76 L160 38 L215 80 L260 62 L330 104 L0 112 Z" fill="#93a6b2"/>
  <path d="M160 38 L178 52 L170 56 L160 50 L150 58 L140 60 Z" fill="#f7f9fa"/>
  <path d="M70 58 L84 68 L72 70 L62 66 Z" fill="#f7f9fa"/>
  <!-- Mount Ripinski behind town -->
  <path d="M250 118 L360 70 L430 30 L470 42 L520 26 L610 78 L700 118 Z" fill="#6f8a7c"/>
  <path d="M430 30 L446 40 L470 42 L486 36 L520 26 L540 40 L512 42 L490 50 L466 54 L446 50 Z" fill="#f4f7f8"/>
  <!-- Chilkoot side, right -->
  <path d="M760 120 L860 64 L930 80 L1010 46 L1110 92 L1200 82 L1200 124 Z" fill="#7d93a0"/>
  <path d="M1010 46 L1030 60 L1012 62 L998 56 Z" fill="#f7f9fa"/>
  <!-- forested shore -->
  <path d="M0 126 Q160 108 330 118 Q520 104 700 120 Q900 110 1200 122 L1200 140 L0 140 Z" fill="#33503f"/>
  <!-- Fort Seward officers' row: white houses with red roofs on the hill -->
  <g fill="#ffffff" stroke="#6d6d6d" stroke-width="0.6">
    <rect x="560" y="106" width="14" height="9"/><rect x="580" y="104" width="14" height="9"/><rect x="600" y="102" width="14" height="9"/><rect x="620" y="101" width="14" height="9"/><rect x="640" y="102" width="14" height="9"/>
  </g>
  <g fill="#9b3b2e">
    <path d="M558 106 L567 100 L576 106 Z"/><path d="M578 104 L587 98 L596 104 Z"/><path d="M598 102 L607 96 L616 102 Z"/><path d="M618 101 L627 95 L636 101 Z"/><path d="M638 102 L647 96 L656 102 Z"/>
  </g>
  <!-- town on the flat -->
  <g fill="#e8e1d2" stroke="#7a7a7a" stroke-width="0.5">
    <rect x="360" y="118" width="12" height="8"/><rect x="378" y="116" width="16" height="10"/><rect x="400" y="119" width="10" height="7"/><rect x="416" y="117" width="14" height="9"/><rect x="436" y="118" width="11" height="8"/>
  </g>
  <!-- water -->
  <rect y="138" width="1200" height="42" fill="url(#hsea)"/>
  <!-- harbor breakwater and masts -->
  <path d="M780 140 L1000 140 L1000 146 L780 146 Z" fill="#8c8c84"/>
  <path d="M1000 140 L1010 160 L1004 162 L996 146 Z" fill="#8c8c84"/>
  <g stroke="#f4f4f0" stroke-width="1.4">
    <line x1="810" y1="140" x2="810" y2="118"/><line x1="836" y1="140" x2="836" y2="122"/><line x1="868" y1="140" x2="868" y2="114"/><line x1="902" y1="140" x2="902" y2="124"/><line x1="934" y1="140" x2="934" y2="120"/><line x1="964" y1="140" x2="964" y2="126"/>
  </g>
  <g fill="#f4f4f0"><path d="M800 140 L822 140 L818 135 L804 135 Z"/><path d="M856 140 L880 140 L876 134 L860 134 Z"/><path d="M924 140 L946 140 L942 135 L928 135 Z"/></g>
  <!-- light ripples -->
  <g stroke="#cfe0e6" stroke-width="1" opacity="0.6"><line x1="80" y1="156" x2="140" y2="156"/><line x1="300" y1="166" x2="380" y2="166"/><line x1="560" y1="158" x2="610" y2="158"/><line x1="1060" y1="168" x2="1130" y2="168"/></g>
  <!-- bald eagles soaring -->
  <g fill="#2a2620">
    <path d="M700 40 q14 -10 28 -2 q6 -2 8 2 q2 -4 8 -2 q14 -8 28 2 q-16 0 -30 6 q-4 2 -6 0 q-2 2 -6 0 q-14 -6 -30 -6 Z"/>
    <path d="M760 66 q10 -7 20 -1 q4 -1 6 1 q2 -3 6 -1 q10 -6 20 1 q-11 0 -21 4 q-3 2 -5 0 q-2 2 -5 0 q-10 -4 -21 -4 Z"/>
  </g>
  <g fill="#ffffff"><circle cx="736" cy="40.5" r="2.4"/><circle cx="786" cy="66.4" r="1.7"/></g>
</svg>
