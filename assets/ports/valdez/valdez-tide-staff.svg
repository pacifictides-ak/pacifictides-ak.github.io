    <line x1="12" y1="20" x2="24" y2="20"/><line x1="12" y1="40" x2="20" y2="40"/><line x1="12" y1="60" x2="24" y2="60"/>
    <line x1="12" y1="80" x2="20" y2="80"/><line x1="12" y1="100" x2="24" y2="100"/><line x1="12" y1="120" x2="20" y2="120"/>
